    <script>
      (function() {
        // Neutralize Vite HMR WebSocket in preview iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('token') !== -1 || protocols === 'vite-hmr') {
              // Return a mock WebSocket object that silently prevents connection errors
              var fakeWs = {
                url: urlStr,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  // No-op for vite client listeners
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress console and unhandled errors from @vite/client
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return (a && a.stack) || (a && a.message) || String(a); }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('@vite/client') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || (event && event.error && event.error.message) || '';
          var src = (event && event.filename) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            src.indexOf('@vite/client') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || (reason && reason.stack) || '') || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();

      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
